# Config for the ExtrAnom Phase 1 pipeline (M1-M9).
# On Colab, override data_root with the Drive path; no code changes needed.
source: ExtrAnom
data_root: data/sample
manifest_path: data/manifest.json
normal_category: Normal
video_extensions: [".mp4", ".avi", ".mov", ".mkv"]

# M2 preprocessing
preprocess:
  processed_dir: data/processed
  clean_manifest_path: data/manifest_clean.json
  target_fps: 30          # resample every clip to this frame rate
  max_side: 640           # longest side in pixels; aspect ratio kept (no distortion)
  denoise: false          # light hqdn3d denoise; off by default, see README/STATE notes

# M8 ASSM
assm:
  model: models/yolov8n-pose.pt      # downloaded automatically by ultralytics if missing
  tracker: configs/bytetrack_vaw.yaml  # ByteTrack settings (see that file)
  conf: 0.1                          # model floor; ByteTrack's own thresholds (0.4 high / 0.1 low) decide
  imgsz: 640
  stitch: true                       # join broken tracklets of one person (stitch_tracks)
  stitch_max_gap: 45                 # frames a person may vanish and still be re-joined
  stitch_max_dist: 1.5               # max jump in body heights between end and restart
  device: auto                       # auto = cuda if available, else cpu
  use_shots: true                    # process shot by shot (tracker restarts at editing cuts)
  tracks_dir: data/tracks            # M8a output: one .npz per clip
  # M8b Algorithm 1 (starting values: equal weights, tune on the full set)
  w1: 1.0                # weight on 1/d  (d in body heights)
  w2: 1.0                # weight on closing speed (body heights per second)
  w3: 1.0                # weight on path obstruction b_ij (0 disables it)
  lag_frames: 5          # closing speed measured over up to this many frames
  d_floor: 0.25          # smallest d used in 1/d (avoids blow-up when boxes overlap)
  corridor: 1.0          # j blocks i if within this many body heights of the i->exit line
  kpt_conf: 0.5          # keypoint confidence needed to count in the pose centroid
  scores_dir: data/scores     # M8b output

# M9 Selective Activation: behavior states (units: body heights = bh, seconds = s)
gate:
  gate_dir: data/gate
  smooth_s: 0.5              # trailing smoothing of positions
  vel_s: 0.5                 # velocity / closing speed measured over this window
  gap_fill_s: 0.2            # fill track dropouts up to this long before smoothing
  gap_s: 0.5                 # bridge gaps up to this long inside a state (hysteresis)
  min_cotracked_s: 1.0       # ignore pairs seen together for less than this
  min_track_conf: 0.35       # ignore tracks whose mean detection confidence is below this (chairs etc. boxed as people)
  move_speed: 0.25           # bh/s: counts as "moving"
  still_speed: 0.15          # bh/s: counts as "standing still"
  approach_closing: 0.3      # bh/s distance must shrink at least this fast
  approach_max_d: 6.0        # only count approach when closer than this (bh)
  approach_min_s: 1.0
  approach_min_drop: 0.8     # net distance reduction over the approach (bh)
  follow_max_d: 3.0          # bh
  follow_cos: 0.5            # heading alignment (cosine of velocity vectors)
  follow_behind: 0.5         # trailing score: the other person moves away along the line between them
  follow_min_s: 4.0
  hover_max_d: 1.5
  hover_min_s: 3.0
  corner_max_d: 2.0
  corner_blocked_speed: 0.3  # bh/s: the blocked person is slow/stopped
  corner_min_s: 1.5
  corner_activity_s: 3.0     # the blocker must have moved within this long before (not just standing there)
  burst_abs: 2.5             # bh/s relative speed always counted as a burst
  burst_mad_k: 4.0           # or this many robust deviations above the pair's own median
  burst_max_d: 2.5
  burst_min_s: 0.2
  burst_smooth_s: 0.15       # bursts use a short smoothing/velocity window (they are brief)
  burst_vel_s: 0.2

# Phase 1 deliverable: buildup videos + category report
report:
  report_dir: data/report
  act_categories: [Assassination, Chain_Snatching, Kidnapping]   # clips that contain the violent act
  cut_margin_s: 1.0          # video ends this long BEFORE the detected escalation (bigger = safer, less buildup shown)
  act_tail_trim_s: 3.0       # act categories with no detected escalation: drop this much off the end (uniform)
  min_video_s: 1.5           # shorter pre-violence footage than this is not rendered
  withheld_card_s: 1.5       # length of the "footage withheld" card at the cut
  overrides_csv: configs/clip_overrides.csv   # optional manual cut times: clip_id,cut_s
  showcase_top: 5            # per category: clips with the most buildup evidence ...
  showcase_random: 5         # ... plus this many random clips (so the showcase is not cherry-picked)
  seed: 7
  review_flagged: 20         # review sheet: flagged clips to check by eye (precision)
  review_unflagged: 10       # review sheet: unflagged non-Normal clips to check (what was missed)

# Deep context layer (src/context): camera, ground-plane geometry, pose features, following
context:
  context_dir: data/context
  person_height_m: 1.7        # standing-height prior used to turn box heights into meters
  fov_deg: 60.0               # assumed horizontal field of view (unknown for ExtrAnom; CCTV is typically 55-90)
  smooth_s: 0.5               # trailing smoothing of ground-plane positions
  vel_s: 0.5                  # velocity window
  gap_fill_s: 0.3             # interpolate track dropouts up to this long
  min_track_conf: 0.35        # ignore tracks with lower mean detection confidence
  min_cotracked_s: 1.0        # ignore pairs seen together for less than this
  max_pair_dist_m: 12.0       # pairs never closer than this are skipped
  camera_max_side: 320        # camera-motion pass runs on frames downscaled to this size
  camera_move_frac: 0.002     # per-frame translation (fraction of image side) above which the camera counts as moving
  camera_moving_share: 0.30   # share of such frames above which the clip is "camera moving"
  night_brightness: 70        # mean luma below this = night/dark
  follow_window_s: 4.0        # window for the lagged-path follow score
  follow_lag_min_s: 0.5
  follow_lag_max_s: 6.0
  follow_max_path_dev_m: 1.0  # follower within this of the leader's earlier position (mean over window)
  follow_rel_dev: 0.6         # ... and closer to the leader's path than this share of the current separation
  follow_min_leader_path_m: 2.0   # the leader must actually have walked this far in the window
  follow_max_sep_m: 10.0
  follow_min_s: 3.0           # follow must last this long to count
  contact_wrist_m: 0.25       # wrist-to-torso keypoint distance (in body heights x 0.17 m scale) for contact, see pose_features
  contact_max_ground_m: 1.2   # and the two people must be this close on the ground plane
  facing_toward_deg: 60.0
  facing_away_deg: 120.0
  min_event_s: 0.5
  layout_keyframes: 5          # Stage B: frames segmented per clip (majority vote)
  depth_frames: 12             # Stage B: frames of the key pair run through Depth Anything
  min_ground_conf: 0.8        # speeds / following only for upright, uncropped people (box height is the depth cue)
  flee_vel_s: 0.8             # running away is measured over this window (robust to box-height jitter)
  flee_speed_ms: 2.2          # m/s: faster than a brisk walk, while moving away from the other person

# Stage D: window-level learning with shortcut probes (src/context/learn.py)
learn:
  learn_dir: data/learn
  window_s: 3.0
  step_s: 1.5
  max_pairs_per_clip: 25     # crowded scenes: keep the 25 closest pairs per clip (speed, and the rest are bystanders)
  topk: 3                    # clip score = mean of its top-k window scores (multiple-instance learning)
  folds: 5
  seed: 7

# Stage C: scene graph episodes and the buildup story (src/context/graph.py, narrative.py)
story:
  story_pairs: 2                # pairs narrated per clip (the ones with the most evidence)
  approach_toward_ms: 0.3       # an approach: mover's speed toward the other (m/s) ...
  approach_closing_ms: 0.3      # ... and the separation closing at least this fast
  approach_min_s: 1.0
  hover_dist_m: 1.2             # lingering: within this distance of a person who stands still
  hover_min_s: 3.0
  very_close_min_s: 1.5         # within arm's reach (Hall intimate zone) for this long
  mutual_min_s: 2.0
  block_dist_m: 3.0             # blocking an exit counts only when the two are within this distance
  block_min_s: 1.0
  pinned_dist_m: 1.5            # pinned against an obstacle counts only while the other person is this close
  reach_ms: 1.5                 # hand speed toward the other person's torso (m/s)
  reaction_before_s: 2.0        # target speed is compared before / after an approach starts
  reaction_after_s: 3.0
  # Untuned defaults. Positive = concern cue, negative = benign cue. Calibrate with the annotated benchmark before trusting any total.
  cue_weights:
    approaches_from_behind: 1.0
    approaches_side: 0.4
    approaches_frontal: 0.3
    follows: 2.0
    looks_back: 1.5
    hovers_near: 0.7
    very_close: 0.3
    blocks_exit: 2.0
    pinned_against: 1.5
    reaches_for: 2.0
    contact: 2.0
    flees_from: 1.5
    target_stops: 0.7
    target_speeds_up: 1.0
    mutual_facing: -1.5

# Layer 0: shot segmentation (src/video/shots.py)
shots:
  method: auto               # auto = TransNetV2 if installed, else PySceneDetect, else histogram cuts
  threshold: 0.5             # TransNetV2 transition probability above which a cut is declared
  min_shot_s: 0.4            # shorter shots (flashes, end cards) are merged into their neighbour
  device: auto

# Layer 1: perception shootout (src/perception/shootout.py). Each entry overrides the assm block for that candidate.
perception:
  shootout_dir: data/shootout
  max_s: 12                  # seconds of each clip used for the comparison
  holdout_file: configs/holdout_clips.txt
  configs:
    - {name: v8n_640_byte,     model: models/yolov8n-pose.pt,  imgsz: 640,  tracker: configs/bytetrack_vaw.yaml}
    - {name: y26s_640_byte,    model: models/yolo26s-pose.pt,  imgsz: 640,  tracker: configs/bytetrack_vaw.yaml}
    - {name: y26s_960_byte,    model: models/yolo26s-pose.pt,  imgsz: 960,  tracker: configs/bytetrack_vaw.yaml}
    - {name: y26s_640_botsort, model: models/yolo26s-pose.pt,  imgsz: 640,  tracker: configs/botsort_vaw.yaml}
    - {name: y26m_960_botsort, model: models/yolo26m-pose.pt,  imgsz: 960,  tracker: configs/botsort_vaw.yaml}
    - {name: y26x_960_byte,    model: models/yolo26x-pose.pt,  imgsz: 960,  tracker: configs/bytetrack_vaw.yaml}
    - {name: y26x_1280_botsort_reid, model: models/yolo26x-pose.pt, imgsz: 1280, tracker: configs/botsort_reid_vaw.yaml}
