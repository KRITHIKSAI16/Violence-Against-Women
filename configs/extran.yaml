# Config for the ExtrAnom Phase 1 pipeline (M1-M9).
# On Colab, override data_root with the Drive path; no code changes needed.
source: ExtrAnom
data_root: data/sample
manifest_path: data/manifest.json
normal_category: Normal
video_extensions: [".mp4", ".avi", ".mov", ".mkv"]

# M2 preprocessing
preprocess:
  processed_dir: data/processed
  clean_manifest_path: data/manifest_clean.json
  target_fps: 30          # resample every clip to this frame rate
  max_side: 640           # longest side in pixels; aspect ratio kept (no distortion)
  denoise: false          # light hqdn3d denoise; off by default, see README/STATE notes

# M8 ASSM
assm:
  model: models/yolov8n-pose.pt      # downloaded automatically by ultralytics if missing
  tracker: configs/bytetrack_vaw.yaml  # ByteTrack settings (see that file)
  conf: 0.1                          # model floor; ByteTrack's own thresholds (0.4 high / 0.1 low) decide
  imgsz: 640
  stitch: true                       # join broken tracklets of one person (stitch_tracks)
  stitch_max_gap: 45                 # frames a person may vanish and still be re-joined
  stitch_max_dist: 1.5               # max jump in body heights between end and restart
  device: auto                       # auto = cuda if available, else cpu
  tracks_dir: data/tracks            # M8a output: one .npz per clip
  # M8b Algorithm 1 (starting values: equal weights, tune on the full set)
  w1: 1.0                # weight on 1/d  (d in body heights)
  w2: 1.0                # weight on closing speed (body heights per second)
  w3: 1.0                # weight on path obstruction b_ij (0 disables it)
  lag_frames: 5          # closing speed measured over up to this many frames
  d_floor: 0.25          # smallest d used in 1/d (avoids blow-up when boxes overlap)
  corridor: 1.0          # j blocks i if within this many body heights of the i->exit line
  kpt_conf: 0.5          # keypoint confidence needed to count in the pose centroid
  scores_dir: data/scores     # M8b output

# M9 Selective Activation: behavior states (units: body heights = bh, seconds = s)
gate:
  gate_dir: data/gate
  smooth_s: 0.5              # trailing smoothing of positions
  vel_s: 0.5                 # velocity / closing speed measured over this window
  gap_fill_s: 0.2            # fill track dropouts up to this long before smoothing
  gap_s: 0.5                 # bridge gaps up to this long inside a state (hysteresis)
  min_cotracked_s: 1.0       # ignore pairs seen together for less than this
  move_speed: 0.25           # bh/s: counts as "moving"
  still_speed: 0.15          # bh/s: counts as "standing still"
  approach_closing: 0.3      # bh/s distance must shrink at least this fast
  approach_max_d: 6.0        # only count approach when closer than this (bh)
  approach_min_s: 1.0
  approach_min_drop: 0.8     # net distance reduction over the approach (bh)
  follow_max_d: 3.0          # bh
  follow_cos: 0.5            # heading alignment (cosine of velocity vectors)
  follow_behind: 0.5         # trailing score: the other person moves away along the line between them
  follow_min_s: 4.0
  hover_max_d: 1.5
  hover_min_s: 3.0
  corner_max_d: 2.0
  corner_blocked_speed: 0.3  # bh/s: the blocked person is slow/stopped
  corner_min_s: 1.5
  corner_activity_s: 3.0     # the blocker must have moved within this long before (not just standing there)
  burst_abs: 2.5             # bh/s relative speed always counted as a burst
  burst_mad_k: 4.0           # or this many robust deviations above the pair's own median
  burst_max_d: 2.5
  burst_min_s: 0.2
  burst_smooth_s: 0.15       # bursts use a short smoothing/velocity window (they are brief)
  burst_vel_s: 0.2
