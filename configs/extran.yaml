# Config for the ExtrAnom Phase 1 pipeline (M1-M9).
# On Colab, override data_root with the Drive path; no code changes needed.
source: ExtrAnom
data_root: data/sample
manifest_path: data/manifest.json
normal_category: Normal
video_extensions: [".mp4", ".avi", ".mov", ".mkv"]

# M2 preprocessing
preprocess:
  processed_dir: data/processed
  clean_manifest_path: data/manifest_clean.json
  target_fps: 30          # resample every clip to this frame rate
  max_side: 640           # longest side in pixels; aspect ratio kept (no distortion)
  denoise: false          # light hqdn3d denoise; off by default, see README/STATE notes

# M8 ASSM
assm:
  model: models/yolov8n-pose.pt      # downloaded automatically by ultralytics if missing
  tracker: bytetrack.yaml            # ultralytics built-in ByteTrack config
  conf: 0.4
  imgsz: 640
  device: auto                       # auto = cuda if available, else cpu
  tracks_dir: data/tracks            # M8a output: one .npz per clip
